name: Code Quality

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"

    - name: Check formatting (black)
      run: black --check optimization_benchmarks tests

    - name: Check imports (isort)
      run: isort --check-only optimization_benchmarks tests

    - name: Lint (flake8)
      run: flake8 optimization_benchmarks tests

    - name: Type check (mypy)
      run: mypy optimization_benchmarks

    - name: Run tests
      run: |
        pytest --cov=optimization_benchmarks --cov-report=xml

